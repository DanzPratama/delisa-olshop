<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sedang Deploy...</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1c1c1c);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    color: #fff;
    text-align: center;
    overflow: hidden;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.container {
    width: 90%;
    max-width: 500px;
}

h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 10px;
}

p {
    opacity: 0.8;
    margin-bottom: 30px;
}

.progress-container {
    width: 100%;
    height: 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 50px;
    overflow: hidden;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
}

.progress-bar {
    height: 100%;
    width: 0%;
    border-radius: 50px;
    background: linear-gradient(90deg, #00f5a0, #00d9f5);
    box-shadow: 0 0 20px #00f5a0, 0 0 40px #00d9f5;
    transition: width 0.5s ease;
}

.percent {
    margin-top: 15px;
    font-weight: 600;
    font-size: 18px;
}

.time {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.7;
}

.footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    font-size: 12px;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="container">
    <h1>🚀 Sedang Mendeploy Sistem...</h1>
    <p>Estimasi selesai sekitar <b>16.00 WIB</b></p>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="percent" id="percent">0%</div>
    <div class="time" id="countdown"></div>
</div>

<div class="footer">
    © 2026 - Mohon tunggu sebentar 🙏
</div>

<script>
const progressBar = document.getElementById("progressBar");
const percentText = document.getElementById("percent");
const countdownText = document.getElementById("countdown");

function updateProgress() {
    const now = new Date();
    const start = new Date();
    start.setHours(0,0,0,0); // mulai hitung dari jam 00:00

    const target = new Date();
    target.setHours(16,0,0,0); // selesai jam 16:00

    if (now >= target) {
        progressBar.style.width = "100%";
        percentText.innerText = "100%";
        countdownText.innerText = "Deployment selesai 🎉";
        return;
    }

    const totalDuration = target - start;
    const elapsed = now - start;

    let percent = (elapsed / totalDuration) * 100;
    if (percent < 0) percent = 0;

    progressBar.style.width = percent + "%";
    percentText.innerText = Math.floor(percent) + "%";

    const diff = target - now;
    const hours = Math.floor(diff / (1000*60*60));
    const minutes = Math.floor((diff % (1000*60*60)) / (1000*60));
    const seconds = Math.floor((diff % (1000*60)) / 1000);

    countdownText.innerText =
        `Sisa waktu: ${hours} jam ${minutes} menit ${seconds} detik`;
}

setInterval(updateProgress, 1000);
updateProgress();
</script>

</body>
</html>
